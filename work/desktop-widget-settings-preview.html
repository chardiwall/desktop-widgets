      {

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      nextState == null ||

    &quot;message&quot;,

      }

    }

      return;
    }

  --app: light-dark(#f6f5f3, #252527);
  --nav: light-dark(#eae8e5, #2d2d30);
  --surface: light-dark(#fffefa, #303034);
  --ink: light-dark(#232224, #f5f2ee);
  --quiet: light-dark(#625d5b, #b9b5b2);
  --line: light-dark(#d7d3ce, #434346);
  --selected: light-dark(#ffedda, #44352c);
  --accent: light-dark(#864215, #ffc28c);
  --action: light-dark(#984c20, #efab74);
  --action-ink: light-dark(#fff, #28190f);
  max-width: 1024px;
  color: var(--ink);
  font: 14px/1.45 &quot;Ubuntu Sans&quot;, system-ui, sans-serif;
}
#desktop-widget-settings * { box-sizing: border-box; }
#desktop-widget-settings [hidden] { display: none !important; }
#desktop-widget-settings .window { background: var(--app); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
#desktop-widget-settings .titlebar { padding: 16px 21px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
#desktop-widget-settings .titlebar i, #desktop-widget-settings .titlebar svg { width: 21px; height: 21px; color: var(--accent); }
#desktop-widget-settings h2, #desktop-widget-settings h3, #desktop-widget-settings p { margin: 0; }
#desktop-widget-settings h2 { font-size: 17px; font-weight: 650; }
#desktop-widget-settings h3 { font-size: 24px; font-weight: 570; letter-spacing: -.035em; }
#desktop-widget-settings .content { display: grid; grid-template-columns: 172px minmax(245px, .85fr) minmax(300px, 1.2fr); }
#desktop-widget-settings .sidebar { padding: 16px 10px; background: var(--nav); border-right: 1px solid var(--line); display: grid; align-content: start; gap: 6px; }
#desktop-widget-settings .nav-row { display: flex; align-items: center; gap: 5px; padding-right: 7px; border-radius: 9px; min-width: 0; }
#desktop-widget-settings .nav-row:has([aria-current=&quot;page&quot;]) { background: var(--selected); color: var(--accent); }
#desktop-widget-settings button, #desktop-widget-settings select, #desktop-widget-settings input { font: inherit; color: inherit; }
#desktop-widget-settings button { cursor: inherit; }
#desktop-widget-settings button:focus-visible, #desktop-widget-settings select:focus-visible, #desktop-widget-settings input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#desktop-widget-settings .nav-button { font-weight: 600; display: flex; gap: 7px; flex: 1; padding: 12px 4px 12px 8px; min-width: 0; align-items: center; text-align: left; background: transparent; border: 0; }
#desktop-widget-settings .nav-button i, #desktop-widget-settings .nav-button svg { display: block; flex: 0 0 16px; width: 16px; height: 16px; }
#desktop-widget-settings .widget-switch { appearance: none; width: 30px; height: 18px; flex: 0 0 auto; border-radius: 20px; border: 1px solid var(--quiet); background: var(--surface); margin: 0; padding: 2px; }
#desktop-widget-settings .widget-switch::before { content: &quot;&quot;; display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--quiet); }
#desktop-widget-settings .widget-switch:checked { background: var(--action); border-color: var(--action); }
#desktop-widget-settings .widget-switch:checked::before { background: var(--action-ink); transform: translateX(12px); }
#desktop-widget-settings .settings { padding: 21px 18px; min-width: 0; }
#desktop-widget-settings .fields { display: grid; gap: 12px; margin-top: 17px; }
#desktop-widget-settings .field { display: grid; gap: 4px; min-width: 0; }
#desktop-widget-settings .field-label { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 570; }
#desktop-widget-settings select { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; min-height: 36px; width: 100%; padding: 5px 7px; }
#desktop-widget-settings .colours { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; font-size: 12px; }
#desktop-widget-settings input[type=&quot;color&quot;] { min-height: 34px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
#desktop-widget-settings input[type=&quot;range&quot;] { width: 100%; margin: 0; accent-color: var(--action); }
#desktop-widget-settings output { color: var(--quiet); font-weight: 400; font-variant-numeric: tabular-nums; }
#desktop-widget-settings .hint { color: var(--quiet); font-size: 13px; }
#desktop-widget-settings .preview { min-width: 0; padding: 22px 18px 18px 0; display: grid; grid-template-rows: auto 1fr; gap: 9px; }
#desktop-widget-settings .preview-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 9px; }
#desktop-widget-settings .preview-heading h3 { font-size: 15px; letter-spacing: 0; }
#desktop-widget-settings .desktop {
  position: relative; isolation: isolate; min-height: 370px; display: flex; align-items: flex-end; justify-content: flex-end;
  padding: 43px 13px 20px; border-radius: 14px; border: 1px solid #464247; overflow: hidden;
  color: #f5f1ed;
  background: radial-gradient(ellipse at 75% 105%, #544139, transparent 72%),
              radial-gradient(ellipse at 15% 0%, #4a434a, transparent 57%),
              linear-gradient(155deg, #28262c, #201e24 70%, #322927);
}
#desktop-widget-settings .desktop::before { content:&quot;&quot;; position: absolute; z-index: -1; inset: 15% -24% 4% -50%; border-radius: 60%; transform: rotate(-23deg); border: 1px solid #f2d1a220; box-shadow: 0 0 0 25px #f2d1a20b, 0 0 0 55px #f2d1a208, 0 0 0 85px #f2d1a206; }
#desktop-widget-settings .cord { position: absolute; top: 8px; right: 8px; width: 34px; min-height: 34px; display: grid; place-items: center; z-index: 3; color: #f5f1ed; background: #2b282e; border: 1px solid #5d5156; border-radius: 9px; }
#desktop-widget-settings .cord[aria-pressed=&quot;true&quot;] { color: #ffc992; }
#desktop-widget-settings .cord i, #desktop-widget-settings .cord svg { width: 17px; height: 17px; }
#desktop-widget-settings .desk-cards { position: absolute; inset: 48px 14px 21px; }
#desktop-widget-settings .widget-card { --sample-width: 95%; position: relative; width: var(--sample-width); border: 1px solid #ffffff35; border-radius: 13px; padding: 10px 13px; background: #312e36; overflow-wrap: anywhere; }
#desktop-widget-settings .widget-card[data-style=&quot;solid&quot;] { border-radius: 8px; background: #202126; }
#desktop-widget-settings .widget-card[data-style=&quot;minimal&quot;] { background: #242128; border-color: transparent; border-radius: 2px; }
#desktop-widget-settings .desktop[data-glow=&quot;true&quot;] .widget-card { border-color: color-mix(in srgb, var(--widget-accent) 70%, #64545a); box-shadow: 0 0 19px color-mix(in srgb, var(--widget-accent) 30%, transparent); }
#desktop-widget-settings .ayah-sample { text-align: center; }
#desktop-widget-settings .ayah-sample .arabic { line-height: 1.5; }
#desktop-widget-settings .ayah-sample .divider { height: 1px; background: var(--widget-accent); margin: 5px auto 6px; width: 50%; opacity: .75; }
#desktop-widget-settings .ayah-sample .reference { color: var(--widget-accent); font-size: 11px; padding-top: 3px; }
#desktop-widget-settings .clock-sample { container-type: inline-size; }
#desktop-widget-settings .clock-sample .time { font-size: min(var(--clock-size, 39px), calc((100cqw - var(--avatar-space, 0px)) / 4.4)); font-variant-numeric: tabular-nums; letter-spacing: -.055em; line-height: 1.12; white-space: nowrap; }
#desktop-widget-settings .clock-sample .date { margin-top: 3px; font-size: 11px; max-width: 72%; }
#desktop-widget-settings .clock-sample .progress-track { margin-top: 7px; height: 2px; border-radius: 8px; background: #ffffff25; overflow: hidden; }
#desktop-widget-settings .clock-sample .progress-fill { width: 61%; height: 100%; background: var(--widget-accent); }
#desktop-widget-settings .avatar {
  --avatar-scale: 1; position: absolute; z-index: 2; width: 60px; height: 133px;
  transform: scale(var(--avatar-scale)); transform-origin: bottom right; pointer-events: none;
}
#desktop-widget-settings .clock-sample .avatar { bottom: 12px; right: 8px; }
#desktop-widget-settings .footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
#desktop-widget-settings .footer p { margin-right: auto; color: var(--quiet); }
#desktop-widget-settings .footer button { min-height: 35px; padding: 5px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; }
#desktop-widget-settings .footer [data-action=&quot;apply&quot;] { color: var(--action-ink); border-color: var(--action); background: var(--action); }
#desktop-widget-settings .footer button:disabled { opacity: .55; }
@media (max-width: 760px) {
  #desktop-widget-settings .content { grid-template-columns: minmax(208px, .8fr) minmax(265px, 1.2fr); }
  #desktop-widget-settings .sidebar { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); border-right: 0; border-bottom: 1px solid var(--line); padding-block: 7px; }
}
@media (max-width: 520px) {
  #desktop-widget-settings .content { display: block; }
  #desktop-widget-settings .nav-button i, #desktop-widget-settings .nav-button svg { display: none; }
  #desktop-widget-settings .preview { padding: 0 12px 14px; }
  #desktop-widget-settings .desktop { min-height: 345px; }
}
@media (pointer: coarse) {
  #desktop-widget-settings .nav-button, #desktop-widget-settings select, #desktop-widget-settings input[type=&quot;color&quot;], #desktop-widget-settings .footer button { min-height: 44px; }
  #desktop-widget-settings .widget-switch { outline-offset: 5px; }
}
#desktop-widget-settings .titlebar { padding-block: 18px; }
#desktop-widget-settings .titlebar h2 { letter-spacing: -.02em; }
#desktop-widget-settings .sidebar { align-content: start; }
#desktop-widget-settings .nav-row:has([data-tab=&quot;placement&quot;]) { border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; margin-top: 7px; }
#desktop-widget-settings .settings { padding-top: 19px; }
#desktop-widget-settings .themes { margin: 13px 0 0; padding: 0; border: 0; min-width: 0; }
#desktop-widget-settings .themes legend { padding: 0; margin-bottom: 6px; font-weight: 570; }
#desktop-widget-settings .theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
#desktop-widget-settings .theme-choice { text-align: left; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 4px 5px 5px; min-width: 0; font-size: 12px; }
#desktop-widget-settings .theme-choice:hover { border-color: var(--accent); }
#desktop-widget-settings .theme-choice[aria-pressed=&quot;true&quot;] { color: var(--accent); background: var(--selected); border-color: var(--accent); }
#desktop-widget-settings .theme-choice .swatch { display: block; height: 19px; margin-bottom: 3px; border-radius: 5px; background: linear-gradient(135deg, var(--swatch-start) 25%, var(--swatch-end)); }
#desktop-widget-settings .theme-choice[data-theme=&quot;custom&quot;] .swatch { background: linear-gradient(115deg, #ca8355, #c393b3 52%, #7366a1); }
#desktop-widget-settings .display-list { display: flex; gap: 6px; margin: 0; }
#desktop-widget-settings .display-select { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 5px 8px; }
#desktop-widget-settings .display-select[aria-pressed=&quot;true&quot;] { border-color: var(--accent); color: var(--accent); background: var(--selected); }
#desktop-widget-settings .display-select i, #desktop-widget-settings .display-select svg { width: 14px; height: 14px; }
#desktop-widget-settings .preview { grid-template-rows: auto auto 1fr; }
#desktop-widget-settings .desktop { min-height: 345px; }
#desktop-widget-settings .desktop[data-display=&quot;2&quot;] { background: radial-gradient(ellipse at 34% 6%, #464962, transparent 70%), linear-gradient(155deg, #2d2c3c, #232730 70%, #2d292d); }
#desktop-widget-settings .widget-card[data-style] { background: var(--widget-background); }
#desktop-widget-settings .widget-card[data-style=&quot;glass&quot;] { background: linear-gradient(145deg, #ffffff16, #18151b30), var(--widget-background); }
#desktop-widget-settings .widget-card[data-style=&quot;minimal&quot;] { background: color-mix(in srgb, var(--widget-background) 72%, transparent); }
#desktop-widget-settings .dock-zone { position: absolute; inset-inline: 0; display: flex; flex-direction: column; gap: var(--preview-gap, 11px); pointer-events: none; }
#desktop-widget-settings .dock-zone[data-zone^=&quot;top&quot;] { top: 0; }
