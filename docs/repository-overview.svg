        <rect x="32" y="132" width="200" height="64" rx="6"/>
        <text x="48" y="160">GNOME panel menu</text><text class="detail" x="48" y="180">bridge/indicator.js</text>
        <rect class="focus" x="316" y="92" width="216" height="72" rx="6"/>
        <text x="332" y="124">Shared GNOME bridge</text><text class="detail" x="332" y="144">GSettings · GNOME Shell</text>
